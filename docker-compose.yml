version: "3.9"

services:
  zenith-panel:
    build: .
    image: zenith-panel:latest
    container_name: zenith-panel
    restart: unless-stopped
    ports:
      - "8080:8080"                 # panel
      - "25565-25575:25565-25575"   # Minecraft servers spawned by the panel
    environment:
      PANEL_NAME: "Zenith Panel"
      PANEL_URL: "http://localhost:8080"
      PORT: 8080
      HOST: 0.0.0.0
      # generate with: openssl rand -hex 32
      JWT_SECRET: "${JWT_SECRET:-please-change-me-please-change-me}"
      ALLOW_REGISTRATION: "true"
      ZENITH_OWNER_USER: "${ZENITH_OWNER_USER:-admin}"
      ZENITH_OWNER_PASS: "${ZENITH_OWNER_PASS:-changeme123}"
      JAVA_BIN: "java"
      DATA_DIR: "/app/data"
      SERVER_DATA_DIR: "/app/servers"
      BACKUP_DIR: "/app/backups"
      JAVA_DIR: "/app/data/java"
      # The host Docker daemon sees host paths, not /app paths. PWD expands to
      # this compose project directory; override with an absolute
      # HOST_SERVER_DATA_DIR if the server volume lives elsewhere.
      DOCKER_BIND_ROOT: "${HOST_SERVER_DATA_DIR:-${PWD}/servers}"
      # Optional DNS override for isolated workload bridges. Blank copies the
      # panel host/container's real non-loopback resolvers.
      DOCKER_WORKLOAD_DNS: "${DOCKER_WORKLOAD_DNS:-}"
      # Optional only for SteamCMD apps that need an owned Steam account.
      STEAMCMD_USER: "${STEAMCMD_USER:-}"
      STEAMCMD_PASSWORD: "${STEAMCMD_PASSWORD:-}"
      # Set to the host owner of ./servers when it is not UID 1000:1000.
      DOCKER_GAME_UID: "${DOCKER_GAME_UID:-}"
    volumes:
      - ./data:/app/data
      - ./servers:/app/servers
      - ./backups:/app/backups
      # Control-plane only: never mounted into a tenant workload. Required
      # solely when this containerised panel must create Docker workloads.
      - /var/run/docker.sock:/var/run/docker.sock
    # generous limits: the panel spawns one JVM per server
    ulimits:
      nofile: 1048576
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/version').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
