<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Server - Zenith Panel</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23101014'/><text x='16' y='22' font-size='18' font-family='Arial' font-weight='700' fill='%23fff' text-anchor='middle'>Z</text></svg>">
<link rel="stylesheet" href="css/app.css">

      <div class="tab-panel" id="tab-sftp"></div>
      <div class="tab-panel" id="tab-plugins"></div>
      <div class="tab-panel" id="tab-mods"></div>
      <div class="tab-panel" id="tab-backups"></div>
      <div class="tab-panel" id="tab-network"></div>
      <div class="tab-panel" id="tab-schedules"></div>
      <div class="tab-panel" id="tab-people"></div>
      <div class="tab-panel" id="tab-settings"></div>

  </div>
</div>
<script src="js/app.js"></script>
<script src="js/components.js"></script>
